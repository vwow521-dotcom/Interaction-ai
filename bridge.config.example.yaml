# 复制到目标项目根目录并改名为 bridge.config.yaml。没有这个文件时桥使用下面这套默认配置。
# agents: 参与协作的身份（agent_id）。product 决定默认门铃；doorbell: auto（按 product 的默认顺序：claude-code → Claude 消息注入、轮询；
#   codex → Codex 队列消息、Codex Stop hook、轮询；antigravity、deepseek-harness → ACP、轮询）。
#   可选的门铃：claude-socket / codex-queue / codex-hook / acp / poll。也可以写列表，如 [codex-queue, poll]。
# pipeline: 按顺序执行的阶段。gate: true 表示该阶段完成后停下等你在面板上批准；on_reject: 你确认打回时退回到哪个阶段（默认重做本阶段）。
# owns: 该阶段负责的文件（glob）。其他阶段改了这些文件，会在审批卡片上提示（不阻止）。
agents:
  claude: { product: claude-code, doorbell: auto }
  codex:  { product: codex, doorbell: auto }
  # notes 可选，最多 200 字。供会议分配任务时参考，在办公室的成员详情里也可查看。
  # 后台成员按需启用：
  # antigravity:
  #   product: antigravity
  #   doorbell: auto
  #   notes: "适合文档、摘要和文字类第二意见"
  #   acp: { mcp: stdio, mode: accept-edits, permissions: deny }
  # deepseek:
  #   product: deepseek-harness
  #   doorbell: auto
  #   acp:
  #     command: '%DSH_INSTALL_DIR%\DeepSeek Harness.exe'
  #     args: [--expose-internals, '%DSH_INSTALL_DIR%\resources\app.asar\dsh\node_modules\@deepseek-ai\dsh-desktop-host\lib\cli.js', --profile, acp]
  #     env: { ELECTRON_RUN_AS_NODE: '1' }
  #     mcp: http
  #     permissions: deny
pipeline:
  - id: plan
    role: 规划/架构
    agent: claude
    gate: true
    instructions: 把目标细化成可执行的设计说明和验收标准，写进项目文件，交接单里列出关键决策。
    owns: [PLAN.md, "docs/**", "doc/**"]
  - id: implement
    role: 编码
    agent: codex
    instructions: 按规划阶段的设计说明实现，并自己跑一遍验收标准。
  - id: review
    role: 审查
    agent: claude
    gate: true
    on_reject: implement
    instructions: 首次审查要一次列全：先跑完验收标准和相关回归再下结论。每个阻塞问题写进 issues，能复现的附 repro（command、expect，需要时写 cwd），复现用的脚本放在 shared_dir。复审时先对 feedback.blocking 逐条写 rechecks，再提新问题，新问题要写 late_reason。不影响通过的建议写进 observations。
# task_template: 会议定稿后，每个任务按这组阶段走。agent 写 owner（任务负责人）、reviewer（任务审查人）或固定的身份。
# 没有审查人的任务会跳过 agent 为 reviewer 的阶段。
# 定稿的 depends_on 可以写 T1（等 T1 完成）或 T1@implement（等 T1 这一阶段交接）；@ 后面写这里的 stage id。
# 带 on_reject 的阶段算审查：成员同时有待领取的实现和审查时，先发审查。
task_template:
  - id: implement
    role: 实现
    agent: owner
    instructions: 按任务描述和会议纪要实现，只改本任务 paths 范围内的文件，并自己验证一遍。
  - id: review
    role: 审查
    agent: reviewer
    gate: true
    on_reject: implement
    instructions: 首次审查要一次列全：先跑完验收标准和相关回归再下结论。每个阻塞问题写进 issues，能复现的附 repro（command、expect，需要时写 cwd），复现用的脚本放在 shared_dir。复审时先对 feedback.blocking 逐条写 rechecks，再提新问题，新问题要写 late_reason。不影响通过的建议写进 observations。
meetings:
  dir: doc/meetings           # 会议纪要写到这里，定稿时自动提交
  # facilitator: claude       # 负责写定稿和任务清单的成员，默认 agents 里的第一个
leases:
  default_ttl_seconds: 3600   # reserve_paths 不指定 ttl 时的租约时长；任务自带的租约在任务结束时释放
wait:
  poll_seconds: 50            # wait_for_mail 单次最长阻塞秒数，需小于客户端工具超时
  stale_after_seconds: 90     # 超过这么久没动静 → 面板显示“可能断网”
  offline_after_seconds: 300  # 超过这么久没动静 → 判定失联，绑定的身份可被新会话直接 join
mail:
  ring_retry_seconds: 120     # 按了门铃但没来取信 → 隔这么久再按
  max_rings: 3                # 按这么多次仍没反应 → 通知你去叫醒它
  ack_timeout_seconds: 600    # 取走需要确认的信后这么久没确认 → 标红并通知你
                              # 成员用 report_progress 的 busy_minutes 报了长命令时，到期前不报
doorbells:
  max_unconfirmed_rings: 3    # 可验证门铃连续未确认多少次后暂时降级
  cooldown_seconds: 600       # 降级多久后重新尝试该门铃
chat:
  history: 10                 # 聊天信附带的前文条数
  max_agent_turns: 6          # 成员之间连续聊这么多条（中间你没说话）后，它们的 @ 不再叫醒对方，避免互相刷屏
notify:
  enabled: true              # Windows 通知
git:
  auto_commit: true           # 每次交接自动提交。只有一个任务在进行时提交全部改动；有并行任务时只提交本任务范围内的文件
  commit_reviews: true        # 审查没改文件也生成一个空提交，git log 里能看到审查结论
