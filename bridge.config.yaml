# 协作桥迭代自身时用的配置（ai-bridge start --project 本仓库）。没写的部分用默认值，见 bridge.config.example.yaml。
# 规划已经写在 docs/prompts/ 里，所以流水线只有编码和审查两步。
agents:
  claude: { product: claude-code, doorbell: auto }
  codex:  { product: codex, doorbell: auto }
  antigravity:
    product: antigravity
    doorbell: auto
    notes: "轻活：文档、文案、纪要、摘要、文字类第二意见；额度有限，不分配重编码和最终审查"
    acp:
      command: '%LOCALAPPDATA%\agy\bin\agy.exe'
      args: [acp, --disable-telemetry]
      mcp: stdio
      mode: accept-edits
      permissions: allow
  deepseek:
    product: deepseek-harness
    doorbell: auto
    notes: "轻活：文档、文案、纪要、摘要、文字类第二意见；额度有限，不分配重编码和最终审查"
    acp:
      command: 'E:\Deepseek-Harness\DeepSeek Harness.exe'
      args: [--expose-internals, 'E:\Deepseek-Harness\resources\app.asar\dsh\node_modules\@deepseek-ai\dsh-desktop-host\lib\cli.js', --profile, acp, --patch, bridge.deepseek-acp.patch.yaml]
      env: { ELECTRON_RUN_AS_NODE: '1' }
      mcp: http
      permissions: allow
pipeline:
  - id: implement
    role: 编码
    agent: codex
    instructions: 按目标里指定的 docs/prompts/ 文档执行，逐项自测验收标准。遵守文档里「用协作桥改协作桥」的禁区。
  - id: review
    role: 审查
    agent: claude
    gate: true
    on_reject: implement
    instructions: 首次审查要一次列全：先跑完验收标准和相关回归再下结论。每个阻塞问题写进 issues，能复现的附 repro（command、expect，需要时写 cwd），复现用的脚本放在 shared_dir。复审时先对 feedback.blocking 逐条写 rechecks，再提新问题，新问题要写 late_reason。不影响通过的建议写进 observations。
